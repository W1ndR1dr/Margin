<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Product name lives in src/config.ts (APP_NAME); main.tsx keeps this in sync. -->
    <title>Margin</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="mask-icon" href="/icon-mono.svg" color="#2DD4BF" />
    <meta name="theme-color" content="#0A0C10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The ONE external request Margin makes, and only at dev/build time in the
      browser's font cache: Instrument Sans (UI) + JetBrains Mono (numbers).
      README.md records this; it is to be self-hosted before v1 so the app is
      fully offline. No other CDN is allowed at runtime (CLAUDE.md).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
